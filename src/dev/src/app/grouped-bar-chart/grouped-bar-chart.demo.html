<h2>Grouped Bar Chart Demo</h2>

<div style="margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem">
  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center">
    <button class="btn btn-outline" (click)="toggleOrientation()">
      Toggle Orientation (current: {{ orientation() }})
    </button>
    <button class="btn btn-outline" (click)="toggleLoading()">Toggle Loading (current: {{ loading() }})</button>
    <button class="btn btn-outline" (click)="toggleLegend()">Toggle Legend (current: {{ showLegend() }})</button>
    <button class="btn btn-outline" (click)="toggleExportButton()">
      Toggle Export Button (current: {{ showExportButton() }})
    </button>
  </div>
  <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem">
    Bar size:
    <input
      class="clr-input"
      type="number"
      min="1"
      [ngModel]="barSizePx()"
      (ngModelChange)="barSizePx.set($event)"
      style="width: 80px"
    />
  </label>
  <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem">
    Export filename:
    <input
      class="clr-input"
      type="text"
      [ngModel]="exportFilename()"
      (ngModelChange)="exportFilename.set($event)"
      style="width: 220px"
    />
  </label>
</div>

@if (lastClicked()) {
<clr-alert [clrAlertType]="'info'" [clrAlertClosable]="false" style="margin-bottom: 1rem">
  <clr-alert-item>
    <span class="alert-text">
      Clicked: <strong>{{ lastClicked().groupLabel }} / {{ lastClicked().label }}</strong> - Value:
      <strong>{{ lastClicked().value }}</strong>
    </span>
  </clr-alert-item>
</clr-alert>
}

<div class="card" style="margin-bottom: 1.5rem">
  <div class="card-header">Grouped Bar Chart ({{ orientation() }})</div>
  <div class="card-block">
    <div [style.height]="orientation() === 'horizontal' ? '360px' : '320px'" style="width: 100%">
      <clr-grouped-bar-chart
        [data]="data"
        [groups]="groups"
        [orientation]="orientation()"
        [barSizePx]="barSizePx()"
        [loading]="loading()"
        [showLegend]="showLegend()"
        [showExportButton]="showExportButton()"
        [exportFilename]="exportFilename()"
        xAxisLabel="Amount"
        yAxisLabel="Quarter"
        (valueClicked)="onValueClicked($event)"
        style="display: block; width: 100%; height: 100%"
      ></clr-grouped-bar-chart>
    </div>
  </div>
</div>

<div class="card" style="margin-bottom: 1.5rem">
  <div class="card-header">Grouped Vertical Bar Chart (fixed)</div>
  <div class="card-block">
    <div style="height: 320px; width: 100%">
      <clr-grouped-bar-chart
        [data]="data"
        [groups]="groups"
        orientation="vertical"
        [barSizePx]="barSizePx()"
        [showLegend]="showLegend()"
        xAxisLabel="Quarter"
        yAxisLabel="Amount"
        (valueClicked)="onValueClicked($event)"
        style="display: block; width: 100%; height: 100%"
      ></clr-grouped-bar-chart>
    </div>
  </div>
</div>

<div class="card" style="margin-bottom: 1.5rem">
  <div class="card-header">Alert - No Items</div>
  <div class="card-block">
    <div style="height: 220px; width: 100%">
      <clr-grouped-bar-chart
        [data]="emptyData"
        [orientation]="orientation()"
        [barSizePx]="barSizePx()"
        style="display: block; width: 100%; height: 100%"
      ></clr-grouped-bar-chart>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">Alert - Too Many Groups</div>
  <div class="card-block">
    <div style="height: 320px; width: 100%">
      <clr-grouped-bar-chart
        [data]="manyData"
        [groups]="manyGroups"
        [orientation]="orientation()"
        [barSizePx]="barSizePx()"
        [showLegend]="true"
        style="display: block; width: 100%; height: 100%"
      ></clr-grouped-bar-chart>
    </div>
  </div>
</div>
