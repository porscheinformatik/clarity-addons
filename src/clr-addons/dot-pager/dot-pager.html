@if (pages > 0) {
<clr-radio-container clrInline>
  @for (page of pageArray; track page) {
  <clr-radio-wrapper>
    <input
      clrRadio
      type="radio"
      [value]="page+1"
      [(ngModel)]="currentPage"
      name="{{uniqueName}}"
      [attr.data-testid]="'dot-pager-dot-' + (page + 1)"
    />
    <label>&nbsp;</label>
  </clr-radio-wrapper>
  }
</clr-radio-container>
}
