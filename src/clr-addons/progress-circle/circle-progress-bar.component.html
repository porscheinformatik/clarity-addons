<svg class="clr-display-block" [attr.width]="size()" [attr.height]="size()" [attr.viewBox]="viewBox()">
  <circle
    [attr.cx]="center()"
    [attr.cy]="center()"
    [attr.r]="radius()"
    [attr.stroke-width]="bgStrokeWidth()"
    [attr.stroke]="backgroundColorCircle()"
    fill="none"
  />

  @for (segment of segments(); track $index) {
    <circle
      [attr.cx]="center()"
      [attr.cy]="center()"
      [attr.r]="segment.radius"
      [attr.stroke-width]="strokeWidth()"
      [attr.stroke]="segment.color"
      [attr.stroke-dasharray]="segment.dashArray"
      fill="none"
      stroke-linecap="round"
      class="progress-ring"
    />
  }

  <text [attr.x]="center()" [attr.y]="center()" text-anchor="middle" dominant-baseline="central" font-weight="bold">
    {{ label() }}
  </text>
</svg>
