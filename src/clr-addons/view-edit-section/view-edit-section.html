<div class="card view-edit-section" (keyup.escape)="onCancel()" data-testid="view-edit-section">
  <div class="card-block">
    <div class="card-title">
      <ng-template #titleContainer>
        <span
          class="ves-title-text"
          [attr.cds-text]="_titleTextStyle + ' ' + _titleTextFontWeight"
          data-testid="view-edit-section-title"
        >
          {{ _title }} @if (_showBadge) { @if (_badgeContent) {
          <span class="ves-badge" [ngClass]="_badgeClass" data-testid="view-edit-section-badge">
            {{ _badgeContent }}
          </span>
          }
          <ng-content select="[badge]"></ng-content>
          }
        </span>
      </ng-template>
      @if (_isCollapsible && !editMode) {
      <span class="ces-title-row">
        <span
          class="ces-title-trigger"
          data-testid="view-edit-section-title-trigger"
          (click)="onCollapseExpand()"
          (keydown.enter)="onCollapseExpand()"
          (keydown.space)="onCollapseExpand(); $event.preventDefault()"
          tabindex="0"
          role="button"
          [attr.aria-expanded]="!_isCollapsed"
        >
          <ng-template [ngTemplateOutlet]="titleContainer"></ng-template>
        </span>
        <button
          type="button"
          (click)="onCollapseExpand()"
          class="btn btn-icon btn-link ces-caret-btn"
          data-testid="view-edit-section-caret-button"
        >
          <cds-icon shape="angle" size="20" class="ces-caret-icon" [@rotateIcon]="_isCollapsed"></cds-icon>
        </button>
      </span>
      } @else {
      <ng-template [ngTemplateOutlet]="titleContainer"></ng-template>
      }
      <div class="ves-actions">
        @if (_editable && !editMode && actionBlock.children.length == 0) {
        <button
          type="button"
          (click)="onEdit()"
          class="btn btn-icon btn-link ves-action"
          data-testid="view-edit-section-edit-button"
        >
          <cds-icon class="ves-edit-icon" [shape]="_editIcon" size="20"></cds-icon>
        </button>
        }
        <div #actionBlock>
          <ng-content select="[action-block]"></ng-content>
        </div>
      </div>
    </div>
    @if (!(_isCollapsed && _isCollapsible)) {
    <div class="card-text" [@collapseExpandAnimation]="initialized" data-testid="view-edit-section-content">
      @if (!editMode) {
      <ng-template [ngTemplateOutlet]="viewRef"></ng-template>
      } @if (editMode) {
      <ng-template [ngTemplateOutlet]="editRef"></ng-template>
      } @if (editMode) {
      <form clrForm (ngSubmit)="onSubmit()" class="button-bar" data-testid="view-edit-section-form">
        <button class="btn btn-primary ves-save" type="submit" data-testid="view-edit-section-save-button">
          {{ _saveText }}
        </button>
        <button class="btn ves-cancel" (click)="onCancel()" type="button" data-testid="view-edit-section-cancel-button">
          {{ _cancelText }}
        </button>
      </form>
      }
    </div>
    }
  </div>
</div>
