<div class="flow-bar-wrapper">
  @for (step of _steps; track step; let index = $index; let last = $last) {
  <div class="flow-bar-step" [class.active]="step === _activeStep">
    <button
      class="btn btn-link flow-bar-btn"
      [disabled]="!step.enabled"
      [class.active]="step === _activeStep"
      (click)="changeActiveStep(step)"
      [attr.data-testid]="'flow-bar-step-' + (step.title | async)"
    >
      {{index + 1}}. {{(step.title | async)}}
    </button>
    @if (!last) {
    <cds-icon shape="angle" direction="right"></cds-icon>
    }
  </div>
  }
</div>
<clr-dropdown class="flow-bar-dropdown clr-flex-fill" data-testid="flow-bar-dropdown">
  <button type="button" class="btn btn-outline-primary" clrDropdownTrigger data-testid="flow-bar-dropdown-trigger">
    {{_steps.indexOf(_activeStep) + 1}}. {{_activeStep?.title | async}}
    <cds-icon shape="angle" direction="down"></cds-icon>
  </button>
  <clr-dropdown-menu>
    @for (step of _steps; track step; let index = $index; let last = $last) {
    <button
      clrDropdownItem
      type="button"
      class="btn"
      [disabled]="!step.enabled"
      (click)="changeActiveStep(step)"
      [attr.data-testid]="'flow-bar-dropdown-step-' + (step.title | async)"
    >
      {{index + 1}}. {{step.title | async}}
    </button>
    }
  </clr-dropdown-menu>
</clr-dropdown>
