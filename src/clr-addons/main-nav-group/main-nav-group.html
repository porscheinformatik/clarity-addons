<section
  class="nav-link collapsible"
  (click)="onClick($event)"
  (keydown.enter)="onClick($event)"
  (keydown.space)="onClick($event)"
  [class.active]="isActive()"
  tabindex="0"
  [attr.data-testid]="'main-nav-group-toggle-' + (id)"
>
  <input
    id="{{prefix}}{{id}}"
    type="checkbox"
    [checked]="isChecked()"
    [attr.data-testid]="'main-nav-group-checkbox-' + (id)"
  />
  <label class="nav-text nav-trigger" for="{{prefix}}{{id}}" [attr.data-testid]="'main-nav-group-label-' + (id)">
    @if (icon) {
    <cds-icon class="title-icon" [shape]="icon"></cds-icon>
    } {{title}}
    <cds-icon class="dropdown-icon" shape="angle" direction="down"></cds-icon>
  </label>
  <div class="nav-list dropdown-menu">
    <ng-content></ng-content>
  </div>
</section>
