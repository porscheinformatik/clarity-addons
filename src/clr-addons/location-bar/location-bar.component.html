@if (iconShape) {
  <cds-icon [shape]="iconShape" [title]="iconTitle" data-testid="location-bar-icon"></cds-icon>
}
<clr-location-bar-node
  (selectionChanged)="onSelectionChanged($event)"
  (searchItemChanged)="searchItemChanged.emit($event)"
  [parentNode]="root$ | async"
  [clrSearchRequest]="searchRequest"
  [clrSearchResultItems]="searchResultItems"
>
</clr-location-bar-node>
@if (!rootsLoaded) {
  <span class="spinner spinner-inline locationbar-spinner" data-testid="location-bar-roots-spinner"></span>
}
