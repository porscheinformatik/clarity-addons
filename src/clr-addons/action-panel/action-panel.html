@if (_open) {
<div data-testid="action-panel" [@slideIn] class="action-panel-action-wrapper" (@slideIn.done)="resizeWindow()">
  <ng-content select="[clr-action-panel-content]"></ng-content>
</div>
<div
  data-testid="action-panel-backdrop"
  [@fade]
  class="action-panel-backdrop"
  (click)="close()"
  (@fade.done)="resizeWindow()"
></div>
}
