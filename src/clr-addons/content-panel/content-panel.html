@if (_open) {
<div data-testid="content-panel" [@slideIn] class="content-panel-content-wrapper" (@slideIn.done)="resizeWindow()">
  <h3 class="content-panel-title" data-testid="content-panel-title">
    <button
      type="button"
      class="close content-panel-close-btn"
      (click)="close()"
      data-testid="content-panel-close-button"
    >
      <cds-icon class="content-panel-close-icon" shape="times" size="24"></cds-icon>
    </button>
    <ng-content select="[clr-content-panel-title]"></ng-content>
  </h3>
  <ng-content select="[clr-content-panel-content]"></ng-content>
</div>
<div
  data-testid="content-panel-backdrop"
  [@fade]
  class="content-panel-backdrop"
  (click)="close()"
  (@fade.done)="resizeWindow()"
></div>
}
